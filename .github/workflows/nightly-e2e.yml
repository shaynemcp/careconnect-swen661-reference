name: Nightly E2E

on:
  schedule:
    # 07:00 UTC = 3:00 AM EDT — results are waiting before the team's day starts.
    - cron: '0 7 * * *'
  workflow_dispatch:

# Least privilege: this workflow only ever needs to read the repository.
# Without this, GITHUB_TOKEN defaults to read/write on the whole repo.
permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Run E2E
        run: npm run test:e2e --if-present
